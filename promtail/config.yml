server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /position/positions.yaml

clients:
  - url: http://grafana.vipsolutions.com.br:3100/loki/api/v1/push

scrape_configs:
- job_name: worker-asterisk
  static_configs:
  - targets:
      - localhost
    labels:
      job: console-worker-production
      __path__: /var/log/asterisk/full
  pipeline_stages:
  - regex:
      expression: '^\[(?P<timestamp>[^\]]+)\] (?P<level>\w+)\[(?P<pid>\d+)\] (?P<module>[^:]+): (?P<message>.*)$'
  - labels:
      level:
