services: 

  proxy:
    image: nginx:1.27.2
    volumes:
      - ./nginx/conf-proxy:/etc/nginx/conf.d/
      - ./nginx/certs:/etc/nginx/certs/
    ports:
      - 443:443
    extra_hosts:
      - host.docker.internal:host-gateway

  asterisk:
    build: ./docker-asterisk
    network_mode: host
    volumes: 
      - /etc/localtime:/etc/localtime:ro
      - ./asterisk:/etc/asterisk:ro
      - ./varLibAsterisk:/var/lib/asterisk
      - ./varLogAsterisk:/var/log/asterisk
      - ./varSpoolAsterisk:/var/spool/asterisk
    logging:
      driver: none
    # restart: on-failure

  promtail:
      image: grafana/promtail:3.6.11
      command: -config.file=/etc/promtail/config.yml
      volumes:
        - "./promtail/config.yml:/etc/promtail/config.yml"
        - "./promtail/position:/position"
        - "./varLogAsterisk:/var/log/asterisk:ro"
      ports:
        - 9080:9080


